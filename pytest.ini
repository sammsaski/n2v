[pytest]
# n2v test configuration.
#
# The default run is the fast tier. Three markers are opt-in and deselected by
# the -m expression below: `pytest -m slow`, `pytest -m gpu`, `pytest -m corpus`
# (a later -m on the command line replaces this one; `-m ""` runs everything).
# Selecting gpu or corpus explicitly turns a missing-resource skip into a
# failure (tests/conftest.py), so a requested tier can never pass vacuously.
minversion = 8.0
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# A test marked xfail that passes is a failure until its marker is removed:
# every strict xfail names the plan step that fixes the bug it pins.
xfail_strict = true
faulthandler_timeout = 900

addopts =
    -ra
    --tb=short
    --durations=20
    --strict-markers
    --strict-config
    --import-mode=importlib
    -m "not slow and not gpu and not corpus"

# Warnings are errors. Every ignore below is message-based (the conformal
# deprecation uses stacklevel=2, so module filters would not match), names
# what emits it and, for n2v's own warnings, the plan step that removes it.
filterwarnings =
    error
    ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning
    ignore:The feature will be removed. Please remove usage of this function:DeprecationWarning
    ignore:Using a non-tuple sequence for multidimensional indexing is deprecated:UserWarning
    ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
    ignore:The epoch parameter in `scheduler.step\(\)` was not necessary:UserWarning
    ignore:The balance properties of Sobol' points require n to be a power of 2:UserWarning
    ignore:.* does not support exact method; using approx\.:UserWarning
    ignore:Solution may be inaccurate\. Try another solver:UserWarning
    ignore:compute_normalization\(training_errors\) called without `calibration_errors`:DeprecationWarning

markers =
    slow: takes more than a few seconds (long flow training, large Monte Carlo sweeps); run with `-m slow`
    gpu: needs a CUDA device; the certified GPU engine on CPU torch is deliberately NOT behind this marker
    corpus: needs external data (the VNN-COMP benchmark corpus or reference checkouts); run with `-m corpus`
